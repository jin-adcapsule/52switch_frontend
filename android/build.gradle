allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.8.0"  // Use a compatible AGP version
        classpath "com.google.gms:google-services:4.4.2" // Ensure Google Services plugin is included
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20" // kotlin gp 
    }


}

rootProject.layout.buildDirectory.dir('../build')
subprojects {
    project.layout.buildDirectory.dir("$rootProject.layout.buildDirectory/$project.name")
}
subprojects {
    project.evaluationDependsOn(':app')
}
tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory

}
ext {
    FirebaseSDKVersion = '33.8.0'
    
}