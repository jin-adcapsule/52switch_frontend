plugins {
    id "com.android.application"
    id "kotlin-android"// Required for Kotlin support
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services'// Firebase services plugin this plugin should be applied last to ensure it configures correctly
}
// def keystorePropertiesFile = rootProject.file("key.properties")
// def keystoreProperties = new Properties()

// if (keystorePropertiesFile.exists()) {
//     keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
// }
android {
    // Set custom output directory
    //buildDir = rootProject.projectDir.parentFile.toPath().resolve("build").toString()
    namespace  "com.adcapsule.app52switch"
    ndkVersion "27.0.12077973" // Replace with the installed NDK version//ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17

    }

    kotlinOptions {
        jvmTarget = '17'//JavaVersion.VERSION_17
    }

    lintOptions {
        checkReleaseBuilds false  // Disables lint checks for release builds
        abortOnError false        // Prevents build failure due to Lint errors
    }
    lint {
        baseline = file("lint-baseline.xml")
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.adcapsule.app52switch"
        
        multiDexEnabled true
        compileSdk 35
        minSdk 33
        targetSdk 35
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        //minSdk = 23//flutter.minSdkVersion
        //targetSdk = flutter.targetSdkVersion
        versionCode 1//versionCode = flutter.versionCode
        versionName "1.0"//versionName = flutter.versionName/
    }
    signingConfigs {
        release {
            // def keystorePropertiesFile = rootProject.file("key.properties")
            // def keystoreProperties = new Properties()
            // keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

            // storeFile file(rootProject.file(keystoreProperties["storeFile"])) // Ensure absolute path
            // storePassword keystoreProperties["storePassword"]
            // keyAlias keystoreProperties["keyAlias"]
            // keyPassword keystoreProperties["keyPassword"]
            storeFile file("keystore.jks") 
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias System.getenv("ANDROID_KEY_ALIAS")
            keyPassword System.getenv("ANDROID_KEY_PASSWORD")
        }
    }
    buildTypes {
        
        release {
            debuggable false
            minifyEnabled true  //minifyEnabled true
            shrinkResources true // Enables resource shrinking
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.release

             // Note: Use signingConfigs.release instead signingConfigs.debug to build a apk or appbundle
             // Specify output directory for APK
            
        }
    }
    compileSdk 35

    // Add this for Java compiler options
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs.add("-Xlint:deprecation")
    }
}
dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.8.0') // Firebase BOM for version management
    implementation 'com.google.firebase:firebase-common' // Core functionality
    implementation 'com.google.firebase:firebase-auth' // Firebase Authentication
    implementation 'com.google.firebase:firebase-messaging' // Firebase Messaging
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'com.google.android.play:core:1.10.0'  // Or the latest stable version
}
flutter {
    source = "../.."
}
