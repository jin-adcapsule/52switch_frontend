    #     dart analyze lib/firebase_options.dart
    #     flutter build ios --release --dart-define=HOST_ADDRESS=${{ secrets.EC2_HOST }} --dart-define=SERVER_PORT=${{ secrets.SERVER_PORT }} --dart-define=USE_EMULATOR=false
    #     rm -f lib/firebase_options.dart

