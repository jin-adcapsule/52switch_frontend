name: Flutter CI

on:
  push:
    branches:
      - wip


jobs:
  build_ios:
    runs-on: [macos-latest]
    steps:

    - name: Checkout code
      uses: actions/checkout@v3
    - name: Install Java 17 (For Gradle)
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'  # Use Eclipse Temurin (compatible with Android)
        java-version: '17'
    - name: Install JAXB for Java 17 (Fix NoClassDefFoundError)
      run: |
        echo "Installing JAXB for Java 17..."
        mkdir -p $HOME/java_libs
        curl -L -o $HOME/java_libs/jaxb-api.jar https://repo1.maven.org/maven2/javax/xml/bind/jaxb-api/2.3.1/jaxb-api-2.3.1.jar
        curl -L -o $HOME/java_libs/jaxb-runtime.jar https://repo1.maven.org/maven2/org/glassfish/jaxb/jaxb-runtime/2.3.1/jaxb-runtime-2.3.1.jar
        export CLASSPATH=$HOME/java_libs/jaxb-api.jar:$HOME/java_libs/jaxb-runtime.jar:$CLASSPATH
        echo "JAXB installed successfully."
    - name: Install Flutter (Stable Channel)
      uses: subosito/flutter-action@v2
      with:
        flutter-version: "3.27.3"  # Make sure to use the correct version
        channel: "stable"
    - name: Accept Android Licenses (For Android Builds)
      run: yes | flutter doctor --android-licenses

    - name: Verify Flutter Installation
      run: flutter doctor -v
    - name: Install Dependencies
      run: flutter pub get

    - name: Upgrade Dependencies (Optional)
      run: flutter pub upgrade --major-versions

    - name: Accept Android Licenses & Install Dependencies
      run: |
        yes | flutter doctor --android-licenses
        flutter pub get
        flutter pub upgrade --major-versions
    ##Android Build - Secure Firebase and Signing for iOS
    - name: Decode & Store Keystore File Securely
      run: |
        echo "::add-mask::${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
        chmod 600 android/app/keystore.jks

    - name: Decode & Store Firebase config (google-services.json)
      run: |
        echo "::add-mask::${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}"
        echo "${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json
        chmod 600 android/app/google-services.json

    - name: Build APK Securely
      run: |
        export JAVA_HOME=$(/usr/libexec/java_home -v 17)
        echo "Using Java Home: $JAVA_HOME"
  
        #Set Env Variables for Signing
        export ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        export ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
        export ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
        
        flutter build apk --release --dart-define=HOST_ADDRESS=${{ secrets.EC2_HOST }} --dart-define=SERVER_PORT=${{ secrets.SERVER_PORT }} --dart-define=USE_EMULATOR=false

        # Secure cleanup: remove sensitive files after use
        rm -f android/app/keystore.jks android/app/google-services.json

    - name: Upload Android APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: build/app/outputs/flutter-apk/app-release.apk

