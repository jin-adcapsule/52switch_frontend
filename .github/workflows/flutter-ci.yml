name: Flutter CI

on:
  push:
    branches:
      - wip


jobs:
  build_ios:
    runs-on: [macos-latest]
    steps:

    - name: Checkout code
      uses: actions/checkout@v3
    - name: Install Java 17 (For Gradle)
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'  # Use Eclipse Temurin (compatible with Android)
        java-version: '17'
    - name: Install Flutter (Stable Channel)
      uses: subosito/flutter-action@v2
      with:
        flutter-version: "3.27.3"  # Make sure to use the correct version
        channel: "stable"
    - name: Accept Android Licenses (For Android Builds)
      run: yes | flutter doctor --android-licenses
    - name: Set Up Android SDK
      run: |
        echo "Setting up Android SDK..."
        export ANDROID_SDK_ROOT=$HOME/Library/Android/sdk
        export ANDROID_HOME=$HOME/Library/Android/sdk
        export PATH=$ANDROID_SDK_ROOT/emulator:$ANDROID_SDK_ROOT/tools:$ANDROID_SDK_ROOT/tools/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
        echo "Android SDK Path: $ANDROID_SDK_ROOT"
        sdkmanager --update
    - name: Verify Flutter Installation
      run: flutter doctor -v
    - name: Install Dependencies
      run: flutter pub get

    - name: Upgrade Dependencies (Optional)
      run: flutter pub upgrade --major-versions


    # Android APK Build
    # - name: Build Android APK
    #   run: |
    #     echo "${{ secrets.FIREBASE_OPTIONS_DART_DEV }}" > lib/firebase_options.dart
    #     dart analyze lib/firebase_options.dart
    #     flutter build apk --release --dart-define=HOST_ADDRESS=${{ secrets.EC2_HOST }} --dart-define=SERVER_PORT=${{ secrets.SERVER_PORT }} --dart-define=USE_EMULATOR=false
    #     rm -f lib/firebase_options.dart
    - name: Decode Firebase Secrets
      run: |
        echo "Decoding Firebase secrets..."
        echo "FIREBASE_ANDROID_API_KEY=$(echo ${{ secrets.FIREBASE_ANDROID_API_KEY_B64 }} | base64 --decode)" >> $GITHUB_ENV
        echo "FIREBASE_ANDROID_APP_ID=$(echo ${{ secrets.FIREBASE_ANDROID_APP_ID_B64 }} | base64 --decode)" >> $GITHUB_ENV
        echo "FIREBASE_MESSAGING_SENDER_ID=$(echo ${{ secrets.FIREBASE_MESSAGING_SENDER_ID_B64 }} | base64 --decode)" >> $GITHUB_ENV
        echo "FIREBASE_PROJECT_ID=$(echo ${{ secrets.FIREBASE_PROJECT_ID_B64 }} | base64 --decode)" >> $GITHUB_ENV
        echo "FIREBASE_STORAGE_BUCKET=$(echo ${{ secrets.FIREBASE_STORAGE_BUCKET_B64 }} | base64 --decode)" >> $GITHUB_ENV
        echo "FIREBASE_IOS_API_KEY=$(echo ${{ secrets.FIREBASE_IOS_API_KEY_B64 }} | base64 --decode)" >> $GITHUB_ENV
        echo "FIREBASE_IOS_APP_ID=$(echo ${{ secrets.FIREBASE_IOS_APP_ID_B64 }} | base64 --decode)" >> $GITHUB_ENV
        echo "FIREBASE_IOS_CLIENT_ID=$(echo ${{ secrets.FIREBASE_IOS_CLIENT_ID_B64 }} | base64 --decode)" >> $GITHUB_ENV
        echo "FIREBASE_IOS_BUNDLE_ID=$(echo ${{ secrets.FIREBASE_IOS_BUNDLE_ID_B64 }} | base64 --decode)" >> $GITHUB_ENV

    - name: Build APK (Android)
      run: |
        export JAVA_HOME=$(/usr/libexec/java_home -v 17)
        echo "Using Java Home: $JAVA_HOME"
        flutter build apk --release \
          --dart-define=FIREBASE_ANDROID_API_KEY="$FIREBASE_ANDROID_API_KEY" \
          --dart-define=FIREBASE_ANDROID_APP_ID="$FIREBASE_ANDROID_APP_ID" \
          --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
          --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
          --dart-define=FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET"

    - name: Upload Android APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: build/app/outputs/flutter-apk/app-release.apk

    # # iOS Build (Only if necessary, macOS runner is required for iOS builds)
