name: app52switch
description: "52switch main application"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
version: 1.0.0+1

environment:
  sdk: ">=3.6.1 <4.0.0" # Updated to Dart 3.6.1  ^3.5.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter #localize your app (support multiple languages)
  fixnum: ^1.0.0 #handling large integers if required by your app(Long type support)
  http: ^0.13.6 #HTTP requests
  flutter_dotenv: ^5.0.2 #loading environment variables, so if you're using environment-based configuration
  flutter_switch: ^0.3.2 #toggle switch widget
  graphql_flutter: ^5.2.0-beta.3 
  firebase_core: ^3.7.0 #Essential for Firebase services
  firebase_messaging: ^15.1.4 #push notifications
  firebase_auth: ^5.3.2 #Firebase authentication
  provider: ^6.0.5 #state management in Flutter
  #shared_preferences: ^2.0.15 #storing simple data locally on the device
  flutter_local_notifications: ^18.0.1 #show local notifications in your app
  connectivity_plus: ^3.0.6 #checking network connectivity

  intl: ^0.19.0 #internationalization and formatting (dates, numbers, etc.)
  table_calendar: ^3.0.9
  plugin_platform_interface: ^2.1.8 #platform-specific APIs
 # gql_websocket_link: ^2.0.0 #switch websocket protocal between graphql-ws or graphql-transparent-ws
  flutter_secure_storage: ^9.0.0 #securely saving data on both Android and iOS.
  flutter_launcher_icons: ^0.9.3
  logger: ^1.4.0
  fluttertoast: ^8.0.9

  
  cupertino_icons: ^1.0.8   # The following adds the Cupertino Icons font to your application.


dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

